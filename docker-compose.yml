# Local services. Default profile: Postgres + Mailpit (keeps laptop RAM free).
#   docker compose up -d                 # Postgres + Mailpit
#   docker compose --profile full up -d  # + MinIO (S3) and Redis
# Data lives in named volumes (fast on Windows, survives restarts).
# Never run `docker compose down -v` unless you mean to wipe local data.
name: mediflow

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediflow}
      POSTGRES_DB: ${POSTGRES_DB:-mediflow}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command: ['postgres', '-c', 'shared_buffers=256MB', '-c', 'max_connections=100']
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    mem_limit: 128m
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    profiles: [full]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mediflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mediflow-dev-secret}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: [full]
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    mem_limit: 320m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
  redisdata:
