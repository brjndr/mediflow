name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides how much of the pipeline this run needs (scripts/ci-mode.mjs): `docs` for a pull request
  # that changes only Markdown, `tested` for a merge to main that the pull request run already
  # covered, and `full` for everything else.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      # false when a pull request stays inside the other app, so that app's jobs are skipped.
      web: ${{ steps.mode.outputs.web }}
      api: ${{ steps.mode.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit and its parents, which is what the script compares.
          fetch-depth: 2
      - id: mode
        run: node scripts/ci-mode.mjs

  # Secrets added by this change (#1078): the commits of the pull request, or of the push to main.
  # Runs for every change, Markdown included. Accepted test values are in .gitleaks.toml; the
  # weekly full-history scan is in security-scan.yml.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --config /repo/.gitleaks.toml --log-opts="$RANGE"

  docs:
    name: Format check (docs only)
    needs: plan
    if: needs.plan.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # Records the bundle sizes of main once per merge, so pull requests compare against them without
  # building the base branch again.
  baseline:
    name: Bundle baseline for main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: |
          mkdir -p "$RUNNER_TEMP/bundle-base"
          node scripts/bundle-budget.mjs --json "$RUNNER_TEMP/bundle-base/base-bundle.json" --measure-only
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bundle-base
          key: bundle-base-${{ github.sha }}

  # The web suite split in three, one runner each (#531). Each shard keeps a blob of its results and
  # coverage; `web-coverage` merges them and enforces the thresholds for the foundation folders.
  web-test:
    name: Web tests (shard ${{ matrix.shard }}/3)
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Thresholds are zero here: one shard sees a third of the tests. web-coverage enforces them.
      - run: pnpm --filter web exec vitest run --coverage --shard=${{ matrix.shard }}/3 --reporter=default --reporter=blob --coverage.thresholds.lines=0 --coverage.thresholds.branches=0 --coverage.thresholds.functions=0 --coverage.thresholds.statements=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: web-blob-${{ matrix.shard }}
          path: apps/web/.vitest/blob
          retention-days: 1

  web-coverage:
    name: Web coverage thresholds
    needs: [plan, web-test]
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: web-blob-*
          path: apps/web/.vitest/blob
          merge-multiple: true
      - run: pnpm --filter web exec vitest --merge-reports --coverage

  verify:
    name: Lint, typecheck, test, build
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    # Runs took 10 to 14.5 minutes and two were cancelled at 15 (#527): keep a 2x margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # The web unit tests run in the `web-test` shards and `web-coverage` (below), in parallel.
      - run: pnpm test:scripts
      - run: pnpm build

      # On a pull request the report shows what the PR changes against the base branch. The sizes of
      # the base come from the `baseline` job of the run on main.
      - name: Restore the base branch bundle sizes
        if: github.event_name == 'pull_request'
        id: basecache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bundle-base
          key: bundle-base-${{ github.event.pull_request.base.sha }}
      # Only when main has no recorded sizes for that commit: build the base branch here.
      # A failure only loses the comparison: the budgets below are still enforced.
      - name: Measure the base branch bundle
        if: github.event_name == 'pull_request' && steps.basecache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git worktree add ../base FETCH_HEAD
          cd ../base
          pnpm install --frozen-lockfile
          pnpm --filter web build
          # The script comes from this PR, so the base branch does not need to have it.
          # Written to a scratch name first, so a failed build never leaves a half-made baseline.
          node "$GITHUB_WORKSPACE/scripts/bundle-budget.mjs" \
            --dist apps/web/dist --json "$RUNNER_TEMP/base-measured.json" --measure-only
          mkdir -p "$RUNNER_TEMP/bundle-base"
          mv "$RUNNER_TEMP/base-measured.json" "$RUNNER_TEMP/bundle-base/base-bundle.json"

      - name: Bundle budgets
        run: |
          if [ -f "$RUNNER_TEMP/bundle-base/base-bundle.json" ]; then
            pnpm budget --baseline "$RUNNER_TEMP/bundle-base/base-bundle.json"
          else
            pnpm budget
          fi
      - name: Contract types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/contract || (echo "::error::Run 'pnpm gen:api' and commit the result" && exit 1)
      # A breaking change to the contract must come with a raised contract version.
      - name: Contract has no unannounced breaking change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:packages/contract/openapi.json > "$RUNNER_TEMP/base-openapi.json"
          node scripts/contract-check.mjs "$RUNNER_TEMP/base-openapi.json" packages/contract/openapi.json

  # The API suite split in two, each runner with its own Postgres and Mailpit.
  api:
    name: API tests (shard ${{ matrix.shard }}/2)
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      # The same image and credentials as docker-compose.yml, so tests need no configuration.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mediflow
          POSTGRES_PASSWORD: mediflow
          POSTGRES_DB: mediflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediflow -d mediflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Catches staff email so tests can check what was really sent. Nothing leaves the runner.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # RustFS stands in for S3 in the file store tests (a service cannot take a command).
      - name: Start S3-compatible storage
        run: |
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=mediflow -e RUSTFS_SECRET_KEY=mediflow-dev-secret rustfs/rustfs:latest /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/health; then exit 0; fi
            sleep 1
          done
          docker logs s3
          exit 1
      - run: pnpm --filter api exec vitest run --shard=${{ matrix.shard }}/2
        env:
          S3_TEST_ENDPOINT: http://localhost:9000

  # Proves the Dockerfile still builds and the container answers, in parallel with the tests.
  # The image is not pushed anywhere.
  api-image:
    name: API image and health check
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mediflow
          POSTGRES_PASSWORD: mediflow
          POSTGRES_DB: mediflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediflow -d mediflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f apps/api/Dockerfile -t mediflow-api:ci .
      - name: Container starts and answers its health check
        run: |
          docker run -d --name api --network host             -e DATABASE_URL=postgres://mediflow:mediflow@localhost:5432/mediflow_test             -e SMTP_URL=smtp://localhost:1025             -e "MAIL_FROM=Mediflow <no-reply@mediflow.test>"             -e APP_BASE_URL=http://localhost:5173             -e MFA_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=             -e REPORT_URL_SECRET=Zm9yIHRlc3RzIG9ubHkgbm90IGEgcmVhbCBzZWNyZXQ=             -e AUDIT_SEAL_KEY=q83vEjRWeJCrze8SNFZ4kKvN7xI0VniQq83vEjRWeJA=             -e DELETION_DATABASE_URL=postgres://mediflow:mediflow@localhost:5432/mediflow_test             -e FILE_STORE=s3 -e S3_BUCKET=mediflow-ci -e S3_REGION=us-east-1             -e MALWARE_SCANNER=clamav -e CLAMAV_HOST=localhost             mediflow-api:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  # Builds the app itself, so it does not wait for `verify`. Split by project, not by count (#536):
  # `--shard` counts a test the tablet or phone skips at run time (most of a11y and hindi) as much as
  # one that runs, so three even shards gave one 10 minutes of work and another 4. Chromium and the
  # phone run most tests and get two jobs each; the tablet skips most and shares a job with WebKit,
  # the only job that installs WebKit and its system packages (the ones the apt mirror stalls on, #1069).
  e2e:
    name: Playwright (${{ matrix.name }})
    # ubuntu-latest became 26.04, whose libicu the Playwright WebKit build does not match (libicudata.so.74).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium 1/2
            id: chromium-1
            args: --project=chromium --shard=1/2
            browsers: chromium
          - name: chromium 2/2
            id: chromium-2
            args: --project=chromium --shard=2/2
            browsers: chromium
          - name: phone 1/2
            id: phone-1
            args: --project=phone --shard=1/2
            browsers: chromium
          - name: phone 2/2
            id: phone-2
            args: --project=phone --shard=2/2
            browsers: chromium
          - name: tablet and webkit
            id: tablet-webkit
            args: --project=tablet --project=webkit-phone
            browsers: chromium webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # WebKit runs the subset named in playwright.config.ts (the webkit-phone project, #334), in one job.
      # The apt mirror sometimes stalls on the WebKit system packages: cap the first try and retry once.
      - run: |
          echo 'Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99ci-network
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99ci-network
          echo 'Acquire::Retries "5";' | sudo tee -a /etc/apt/apt.conf.d/99ci-network
          echo 'http://azure.archive.ubuntu.com/ubuntu/	priority:1' | sudo tee /etc/apt/apt-mirrors.txt
      - id: pw_install
        run: pnpm --filter web exec playwright install --with-deps ${{ matrix.browsers }}
        timeout-minutes: 8
        continue-on-error: true
      - if: steps.pw_install.outcome != 'success'
        run: |
          sudo pkill -x apt-get || true
          sudo pkill -x dpkg || true
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a
          pnpm --filter web exec playwright install --with-deps ${{ matrix.browsers }}
        timeout-minutes: 10
      - run: pnpm --filter web exec playwright test ${{ matrix.args }}
        env:
          # A distinct name per job, so the blobs do not overwrite each other when merged.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.id }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-blob-${{ matrix.id }}
          path: apps/web/blob-report
          retention-days: 1

  # One HTML report for all the e2e jobs (#536), uploaded as `playwright-report` when any of them failed.
  e2e-report:
    name: Playwright report
    needs: [plan, e2e]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'full' && needs.plan.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: playwright-blob-*
          path: apps/web/all-blob-reports
          merge-multiple: true
      - run: pnpm --filter web exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.e2e.result == 'failure'
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # One job for each of the three configs (desktop, Slow 4G, phone). Each builds and serves the app
  # itself, so none waits for `verify`. Skipped for a pull request that stays inside apps/api.
  lighthouse:
    name: Lighthouse (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            config: lighthouserc.cjs
          - name: slow 4G
            config: lighthouserc.slow4g.cjs
          - name: phone
            config: lighthouserc.mobile.cjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lhci finds Chrome on the runner. See docs/PERFORMANCE.md for the targets.
      - run: pnpm --filter web exec lhci autorun --config=${{ matrix.config }}
      # Reports the runner's BenchmarkIndex and the TBT median per URL, to pick a calibration target
      # (#1150). It only prints: it never fails the job.
      - if: always()
        run: node scripts/lighthouse-summary.mjs "${{ matrix.name }}" apps/web/.lighthouseci apps/web/.lighthouseci-slow4g | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports-${{ strategy.job-index }}
          path: |
            apps/web/.lighthouseci
            apps/web/.lighthouseci-slow4g
          # Both folders start with a dot, which the action skips unless told otherwise (#1151).
          include-hidden-files: true
          retention-days: 7

  audit:
    name: Dependency audit
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Blocking: production dependencies at high or critical, with no allowlist.
      - run: pnpm audit --prod --audit-level high
      # Blocking: every dependency, dev ones too, unless scripts/audit-allowlist.json lists the advisory with a reason and an expiry date (#1068).
      - run: node scripts/audit-gate.mjs
