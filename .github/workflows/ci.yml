name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides how much of the pipeline this run needs (scripts/ci-mode.mjs): `docs` for a pull request
  # that changes only Markdown, `tested` for a merge to main that the pull request run already
  # covered, and `full` for everything else.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      # false when a pull request stays inside the other app, so that app's jobs are skipped.
      web: ${{ steps.mode.outputs.web }}
      api: ${{ steps.mode.outputs.api }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit and its parents, which is what the script compares.
          fetch-depth: 2
      - id: mode
        run: node scripts/ci-mode.mjs

  docs:
    name: Format check (docs only)
    needs: plan
    if: needs.plan.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # Records the bundle sizes of main once per merge, so pull requests compare against them without
  # building the base branch again.
  baseline:
    name: Bundle baseline for main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: |
          mkdir -p "$RUNNER_TEMP/bundle-base"
          node scripts/bundle-budget.mjs --json "$RUNNER_TEMP/bundle-base/base-bundle.json" --measure-only
      - uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/bundle-base
          key: bundle-base-${{ github.sha }}

  # The web suite split in three, one runner each (#531). Each shard keeps a blob of its results and
  # coverage; `web-coverage` merges them and enforces the thresholds for the foundation folders.
  web-test:
    name: Web tests (shard ${{ matrix.shard }}/3)
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Thresholds are zero here: one shard sees a third of the tests. web-coverage enforces them.
      - run: pnpm --filter web exec vitest run --coverage --shard=${{ matrix.shard }}/3 --reporter=default --reporter=blob --coverage.thresholds.lines=0 --coverage.thresholds.branches=0 --coverage.thresholds.functions=0 --coverage.thresholds.statements=0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-blob-${{ matrix.shard }}
          path: apps/web/.vitest/blob
          retention-days: 1

  web-coverage:
    name: Web coverage thresholds
    needs: [plan, web-test]
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: web-blob-*
          path: apps/web/.vitest/blob
          merge-multiple: true
      - run: pnpm --filter web exec vitest --merge-reports --coverage

  verify:
    name: Lint, typecheck, test, build
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    # Runs took 10 to 14.5 minutes and two were cancelled at 15 (#527): keep a 2x margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # The web unit tests run in the `web-test` shards and `web-coverage` (below), in parallel.
      - run: pnpm test:scripts
      - run: pnpm build

      # On a pull request the report shows what the PR changes against the base branch. The sizes of
      # the base come from the `baseline` job of the run on main.
      - name: Restore the base branch bundle sizes
        if: github.event_name == 'pull_request'
        id: basecache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/bundle-base
          key: bundle-base-${{ github.event.pull_request.base.sha }}
      # Only when main has no recorded sizes for that commit: build the base branch here.
      # A failure only loses the comparison: the budgets below are still enforced.
      - name: Measure the base branch bundle
        if: github.event_name == 'pull_request' && steps.basecache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git worktree add ../base FETCH_HEAD
          cd ../base
          pnpm install --frozen-lockfile
          pnpm --filter web build
          # The script comes from this PR, so the base branch does not need to have it.
          # Written to a scratch name first, so a failed build never leaves a half-made baseline.
          node "$GITHUB_WORKSPACE/scripts/bundle-budget.mjs" \
            --dist apps/web/dist --json "$RUNNER_TEMP/base-measured.json" --measure-only
          mkdir -p "$RUNNER_TEMP/bundle-base"
          mv "$RUNNER_TEMP/base-measured.json" "$RUNNER_TEMP/bundle-base/base-bundle.json"

      - name: Bundle budgets
        run: |
          if [ -f "$RUNNER_TEMP/bundle-base/base-bundle.json" ]; then
            pnpm budget --baseline "$RUNNER_TEMP/bundle-base/base-bundle.json"
          else
            pnpm budget
          fi
      - name: Contract types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/contract || (echo "::error::Run 'pnpm gen:api' and commit the result" && exit 1)
      # A breaking change to the contract must come with a raised contract version.
      - name: Contract has no unannounced breaking change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:packages/contract/openapi.json > "$RUNNER_TEMP/base-openapi.json"
          node scripts/contract-check.mjs "$RUNNER_TEMP/base-openapi.json" packages/contract/openapi.json

  # The API suite split in two, each runner with its own Postgres and Mailpit.
  api:
    name: API tests (shard ${{ matrix.shard }}/2)
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      # The same image and credentials as docker-compose.yml, so tests need no configuration.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mediflow
          POSTGRES_PASSWORD: mediflow
          POSTGRES_DB: mediflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediflow -d mediflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Catches staff email so tests can check what was really sent. Nothing leaves the runner.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # RustFS stands in for S3 in the file store tests (a service cannot take a command).
      - name: Start S3-compatible storage
        run: |
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=mediflow -e RUSTFS_SECRET_KEY=mediflow-dev-secret rustfs/rustfs:latest /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/health; then exit 0; fi
            sleep 1
          done
          docker logs s3
          exit 1
      - run: pnpm --filter api exec vitest run --shard=${{ matrix.shard }}/2
        env:
          S3_TEST_ENDPOINT: http://localhost:9000

  # Proves the Dockerfile still builds and the container answers, in parallel with the tests.
  # The image is not pushed anywhere.
  api-image:
    name: API image and health check
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mediflow
          POSTGRES_PASSWORD: mediflow
          POSTGRES_DB: mediflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediflow -d mediflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t mediflow-api:ci .
      - name: Container starts and answers its health check
        run: |
          docker run -d --name api --network host             -e DATABASE_URL=postgres://mediflow:mediflow@localhost:5432/mediflow_test             -e SMTP_URL=smtp://localhost:1025             -e "MAIL_FROM=Mediflow <no-reply@mediflow.test>"             -e APP_BASE_URL=http://localhost:5173             -e MFA_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=             -e REPORT_URL_SECRET=Zm9yIHRlc3RzIG9ubHkgbm90IGEgcmVhbCBzZWNyZXQ=             -e FILE_STORE=s3 -e S3_BUCKET=mediflow-ci -e S3_REGION=us-east-1             -e MALWARE_SCANNER=clamav -e CLAMAV_HOST=localhost             mediflow-api:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  # Builds the app itself, so it does not wait for `verify`; it runs in three shards, one runner each.
  e2e:
    name: Playwright (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # WebKit runs the subset named in playwright.config.ts (the webkit-phone project, #334).
      - run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter web exec playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  # One job for each of the three configs (desktop, Slow 4G, phone). Each builds and serves the app
  # itself, so none waits for `verify`. Skipped for a pull request that stays inside apps/api.
  lighthouse:
    name: Lighthouse (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            config: lighthouserc.cjs
          - name: slow 4G
            config: lighthouserc.slow4g.cjs
          - name: phone
            config: lighthouserc.mobile.cjs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lhci finds Chrome on the runner. See docs/PERFORMANCE.md for the targets.
      - run: pnpm --filter web exec lhci autorun --config=${{ matrix.config }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports-${{ strategy.job-index }}
          path: |
            apps/web/.lighthouseci
            apps/web/.lighthouseci-slow4g
          retention-days: 7

  audit:
    name: Dependency audit
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Report only for now. Make it blocking (drop continue-on-error) once the tree is clean.
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
