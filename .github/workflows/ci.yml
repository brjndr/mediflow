name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm build

      # On a pull request, build the base branch too, so the report can show what the PR changes.
      # A failure here only loses the comparison: the budgets below are still enforced.
      - name: Measure the base branch bundle
        if: github.event_name == 'pull_request'
        id: base
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git worktree add ../base FETCH_HEAD
          cd ../base
          pnpm install --frozen-lockfile
          pnpm --filter web build
          # The script comes from this PR, so the base branch does not need to have it.
          node "$GITHUB_WORKSPACE/scripts/bundle-budget.mjs" \
            --dist apps/web/dist --json "$RUNNER_TEMP/base-bundle.json" --measure-only

      - name: Bundle budgets
        env:
          BASE_MEASURED: ${{ steps.base.outcome }}
        run: |
          if [ "$BASE_MEASURED" = "success" ]; then
            pnpm budget --baseline "$RUNNER_TEMP/base-bundle.json"
          else
            pnpm budget
          fi
      - name: Contract types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/contract || (echo "::error::Run 'pnpm gen:api' and commit the result" && exit 1)

  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Report only for now. Make it blocking (drop continue-on-error) once the tree is clean.
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
